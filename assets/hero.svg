<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d0221"/>
    <stop offset=".45" stop-color="#2b0b5a"/>
    <stop offset=".8" stop-color="#a1197a"/>
    <stop offset="1" stop-color="#ff4f9a"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff35c"/>
    <stop offset=".55" stop-color="#ff8a3d"/>
    <stop offset="1" stop-color="#ff2e88"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff"/>
    <stop offset=".5" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#ff4fd8"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a0638"/>
    <stop offset="1" stop-color="#07010f"/>
  </linearGradient>
  <mask id="sunStripes">
    <rect x="380" y="90" width="240" height="160" fill="#fff"/>
    <rect x="380" y="186" width="240" height="3" fill="#000"/>
    <rect x="380" y="198" width="240" height="5" fill="#000"/>
    <rect x="380" y="211" width="240" height="7" fill="#000"/>
    <rect x="380" y="225" width="240" height="9" fill="#000"/>
  </mask>
  <clipPath id="groundClip"><rect x="0" y="240" width="1000" height="120"/></clipPath>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>
<style>
  .star{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  .hl{animation:run 2.4s cubic-bezier(.55,0,1,.6) infinite;opacity:0}
  @keyframes run{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(120px);opacity:1}}
  .glitchA{animation:gA 4s steps(1) infinite}
  .glitchB{animation:gB 4s steps(1) infinite}
  @keyframes gA{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(-6px,2px);opacity:.85}91%{transform:translate(5px,-3px);opacity:.85}93%{opacity:0}}
  @keyframes gB{0%,88%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(6px,-2px);opacity:.85}92%{transform:translate(-4px,3px);opacity:.85}94%{opacity:0}}
  .role{animation:role 9s infinite}
  @keyframes role{0%,28%{opacity:1;transform:translateY(0)}32%{opacity:0;transform:translateY(-8px)}33%,95%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  .cursor{animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .sunPulse{animation:sp 4s ease-in-out infinite alternate}
  @keyframes sp{from{opacity:.55}to{opacity:.95}}
  text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
</style>

<rect width="1000" height="360" rx="14" fill="url(#sky)"/>

<!-- stars -->
<g fill="#fff">
  <circle class="star" cx="80" cy="40" r="1.6"/>
  <circle class="star" cx="170" cy="95" r="1.2" style="animation-delay:-1s"/>
  <circle class="star" cx="260" cy="30" r="1.4" style="animation-delay:-2s"/>
  <circle class="star" cx="330" cy="120" r="1" style="animation-delay:-.5s"/>
  <circle class="star" cx="690" cy="50" r="1.5" style="animation-delay:-1.5s"/>
  <circle class="star" cx="760" cy="110" r="1.1" style="animation-delay:-2.4s"/>
  <circle class="star" cx="850" cy="35" r="1.7" style="animation-delay:-.8s"/>
  <circle class="star" cx="930" cy="90" r="1.2" style="animation-delay:-1.9s"/>
  <circle class="star" cx="50" cy="150" r="1" style="animation-delay:-2.7s"/>
  <circle class="star" cx="960" cy="160" r="1" style="animation-delay:-.3s"/>
</g>

<!-- sun -->
<circle class="sunPulse" cx="500" cy="170" r="95" fill="#ff4f9a" filter="url(#sunGlow)"/>
<circle cx="500" cy="170" r="88" fill="url(#sun)" mask="url(#sunStripes)"/>

<!-- mountains -->
<path d="M0 240 L70 190 L130 215 L210 150 L290 205 L350 180 L420 240Z" fill="#14042b" stroke="#00f0ff" stroke-width="1.5" stroke-opacity=".7"/>
<path d="M580 240 L650 185 L720 210 L800 140 L880 200 L940 175 L1000 205 L1000 240Z" fill="#14042b" stroke="#00f0ff" stroke-width="1.5" stroke-opacity=".7"/>

<!-- ground + grid -->
<path d="M0 240 H1000 V346 Q1000 360 986 360 H14 Q0 360 0 346Z" fill="url(#ground)"/>
<line x1="0" y1="240" x2="1000" y2="240" stroke="#ff4fd8" stroke-width="2" filter="url(#glow)"/>
<g clip-path="url(#groundClip)" stroke="#ff4fd8" stroke-opacity=".75" stroke-width="1.3">
  <line x1="500" y1="240" x2="500" y2="360"/>
  <line x1="500" y1="240" x2="380" y2="360"/><line x1="500" y1="240" x2="620" y2="360"/>
  <line x1="500" y1="240" x2="250" y2="360"/><line x1="500" y1="240" x2="750" y2="360"/>
  <line x1="500" y1="240" x2="110" y2="360"/><line x1="500" y1="240" x2="890" y2="360"/>
  <line x1="500" y1="240" x2="-40" y2="360"/><line x1="500" y1="240" x2="1040" y2="360"/>
  <line x1="500" y1="240" x2="-220" y2="360"/><line x1="500" y1="240" x2="1220" y2="360"/>
  <line x1="500" y1="240" x2="-450" y2="360"/><line x1="500" y1="240" x2="1450" y2="360"/>
  <line class="hl" x1="0" y1="240" x2="1000" y2="240"/>
  <line class="hl" x1="0" y1="240" x2="1000" y2="240" style="animation-delay:-.4s"/>
  <line class="hl" x1="0" y1="240" x2="1000" y2="240" style="animation-delay:-.8s"/>
  <line class="hl" x1="0" y1="240" x2="1000" y2="240" style="animation-delay:-1.2s"/>
  <line class="hl" x1="0" y1="240" x2="1000" y2="240" style="animation-delay:-1.6s"/>
  <line class="hl" x1="0" y1="240" x2="1000" y2="240" style="animation-delay:-2s"/>
</g>

<!-- title -->
<g text-anchor="middle" font-size="104" font-weight="900" font-style="italic" letter-spacing="4">
  <text class="glitchA" x="500" y="140" fill="#00f0ff">ALEX VU</text>
  <text class="glitchB" x="500" y="140" fill="#ff2e88">ALEX VU</text>
  <text x="500" y="140" fill="url(#title)" stroke="#2b0b5a" stroke-width="2" filter="url(#glow)">ALEX VU</text>
</g>

<!-- rotating role -->
<g text-anchor="middle" class="mono" font-size="20" font-weight="700" letter-spacing="3">
  <rect x="300" y="276" width="400" height="40" rx="20" fill="#07010f" fill-opacity=".75" stroke="#00f0ff" stroke-opacity=".8"/>
  <text class="role mono" x="500" y="303" fill="#00f0ff">&gt; WEB DEVELOPER</text>
  <text class="role mono" x="500" y="303" fill="#ff4fd8" style="animation-delay:-6s">&gt; PHP · LARAVEL · JS</text>
  <text class="role mono" x="500" y="303" fill="#fff35c" style="animation-delay:-3s">&gt; CODE · SHIP · REPEAT</text>
</g>
</svg>
