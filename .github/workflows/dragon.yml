# Đặt file này tại: .github/workflows/dragon.yml trong repo ThaoVuDEV/ThaoVuDEV
name: Generate dragon animation

on:
  schedule:
    - cron: "0 */12 * * *"   # cập nhật mỗi 12 giờ
  workflow_dispatch:          # cho phép bấm chạy tay
  push:
    branches: [main]
    paths: [".github/scripts/dragon.mjs", ".github/workflows/dragon.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dragon SVGs
        run: node .github/scripts/dragon.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
